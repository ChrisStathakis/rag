site_name: embed_process — Local RAG Embedding Pipeline
site_description: Local RAG pipeline on Ollama + qwen3-embedding + LanceDB, built for a GTX 1050 Ti.
docs_dir: docs
site_dir: site

# Build flat .html files (gui.html) instead of directory-style
# URLs (gui/index.html). This is what makes the output a plain
# static site you can open straight from disk.
use_directory_urls: false

nav:
  - Home: index.md
  - Install: install.md
  - Desktop App: gui.md
  - CLI Commands: commands.md
  - Hybrid Search: hybrid-search.md
  - How It Works: extractors.md
  - Schema & Config: schema.md
  - Troubleshooting: troubleshooting.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true
